<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">VanemKrAu — Desktop Apps &amp; Game Tools</title>
  <desc id="description">A dark tech banner for VanemKrAu's GitHub profile with animated radar and particles.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#101826"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.48" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7dd3fc" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#22d3ee" stroke-opacity="0.28" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <!-- kicker -->
    <text x="72" y="76" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="4">VANEMKRAU / BUILDER</text>
    <!-- headline -->
    <text x="72" y="158" fill="#f8fafc" font-size="62" font-weight="750" letter-spacing="-2">Desktop Apps</text>
    <text x="72" y="222" fill="url(#accent)" font-size="54" font-weight="650" letter-spacing="-1">&amp; Game Tools</text>
    <!-- underline bar -->
    <rect x="72" y="255" width="350" height="3" rx="1.5" fill="url(#accent)">
      <animate attributeName="width" values="350;384;350" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <!-- slogan -->
    <text x="72" y="302" fill="#a8b3c5" font-size="22">把游戏与桌面，改成自己能控的样子</text>
    <!-- tech line -->
    <text x="72" y="336" fill="#64748b" font-size="14" letter-spacing="2">C++ · PYTHON · DIRECT3D · FFMPEG · JAVASCRIPT</text>
    <!-- handle -->
    <text x="1128" y="336" fill="#475569" font-size="14" letter-spacing="1" text-anchor="end">@VanemKrAu</text>
  </g>

  <!-- radar target -->
  <g transform="translate(945 178)" fill="none">
    <circle r="116" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1"/>
    <circle r="88" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1">
      <animate attributeName="r" values="88;92;88" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.25;0.45;0.25" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" stroke="#7dd3fc" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle r="18" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)"/>
    <path d="M-140 0H140M0-140V140" stroke="#38bdf8" stroke-opacity="0.13"/>
    <!-- scanning beam -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <path d="M0 0 L130 0" stroke="url(#scan)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="130" cy="0" r="4" fill="#22d3ee" opacity="0.9"/>
    </g>
    <!-- route with flowing dash -->
    <path d="M-82 66L-26 12L22 43L84-52" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="160 160">
      <animate attributeName="stroke-dashoffset" values="320;0" dur="4s" repeatCount="indefinite"/>
    </path>
    <circle cx="-82" cy="66" r="7" fill="#0d1117" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="-26" cy="12" r="7" fill="#0d1117" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="22" cy="43" r="7" fill="#0d1117" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="84" cy="-52" r="7" fill="#0d1117" stroke="#8b5cf6" stroke-width="3" filter="url(#softGlow)"/>
    <path d="M75-52H93M84-61V-43" stroke="#e0f2fe" stroke-width="1.5"/>
  </g>

  <!-- floating particles -->
  <g fill="#38bdf8">
    <circle cx="1126" cy="54" r="3" opacity="0.8">
      <animate attributeName="cy" values="54;42;54" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1102" cy="76" r="2" opacity="0.4">
      <animate attributeName="cy" values="76;88;76" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.15;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="798" cy="286" r="3" opacity="0.5">
      <animate attributeName="cy" values="286;272;286" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="838" cy="306" r="2" opacity="0.35">
      <animate attributeName="cy" values="306;318;306" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.12;0.35" dur="6.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="118" cy="320" r="2" opacity="0.3" fill="#8b5cf6">
      <animate attributeName="cy" values="320;306;320" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="44" r="2" opacity="0.3" fill="#8b5cf6">
      <animate attributeName="cy" values="44;34;44" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
